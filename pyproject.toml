[project]
name = "crystalization"
version = "0.2.0"
description = "Crystal video layer decomposition and object detection"
requires-python = ">=3.13"
dependencies = []


[project.scripts]
annotator-analyze = "annotator.cli:main_analyze"
annotator-visualize = "annotator.cli:main_visualize"
annotator-annotate = "annotator.cli:main_annotate"
annotator-app = "annotator.app:main"
predictor-app = "predictor.app:main"
llm-annotator-annotate = "llm_annotator.cli:main_annotate"
llm-annotator-app = "llm_annotator.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotator", "src/predictor", "src/llm_annotator"]

[tool.ruff]
src = ["src"]

[dependency-groups]
annotator = [
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "scikit-image>=0.26.0",
    "gradio>=5.0",
]
predictor = [
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "pydmd>=1.1.0",
    "gradio>=5.0",
]
llm-annotator = [
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "pydantic>=2.11",
    "pydantic-ai[openai]>=0.2",
    "logfire>=3.0",
    "gradio>=5.0",
    "matplotlib>=3.10",
]
dev = [
    "commitizen>=4.13.9",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]
