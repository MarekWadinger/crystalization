[project]
name = "crystalization"
version = "0.8.0"
description = "Crystal video layer decomposition and object detection"
requires-python = ">=3.13"
dependencies = []


[project.scripts]
annotator-analyze = "annotator.cli:main_analyze"
annotator-visualize = "annotator.cli:main_visualize"
annotator-annotate = "annotator.cli:main_annotate"
annotator-app = "annotator.app:main"
predictor-app = "predictor.app:main"
llm-annotator-annotate = "llm_annotator.cli:main_annotate"
llm-annotator-app = "llm_annotator.app:main"
sharpness-layers-app = "sharpness_layers.app:main"
scale-overlay-app = "scale_overlay.app:main"
scale-overlay-demos = "scale_overlay.render_demos:main"
optics-plots = "optics.plots:main"
optics-sidecar = "optics.cli:main"
optics-highpass = "optics.highpass:main"
crystal-detector-analyze = "crystal_detector.analyze:main"
crystal-detector-export-frames = "crystal_detector.export_frames:main"
crystal-detector-gui = "crystal_detector.gui:main"
crystal-detector-annotate = "crystal_detector.annotate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotator", "src/predictor", "src/llm_annotator", "src/sharpness_layers", "src/optics", "src/scale_overlay", "src/crystal_detector"]

[tool.hatch.build.targets.wheel.force-include]
"configs/camera_100.toml" = "optics/camera_100.toml"

[tool.ruff]
src = ["src"]
line-length = 79

[dependency-groups]
annotator = [
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "scikit-image>=0.26.0",
    "gradio>=5.0",
]
predictor = [
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "pydmd>=1.1.0",
    "gradio>=5.0",
]
llm-annotator = [
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "pydantic>=2.11",
    "pydantic-ai[openai]>=0.2",
    "logfire>=3.0",
    "gradio>=5.0",
    "matplotlib>=3.10",
]
sharpness-layers = [
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "gradio>=5.0",
]
optics = [
    "numpy>=2.4.3",
    "matplotlib>=3.10",
    "scipy>=1.15",
    "opencv-python-headless>=4.13.0.92",
    "scikit-image>=0.26.0",
]
scale-overlay = [
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "gradio>=5.0",
    "matplotlib>=3.10",
]
dev = [
    "commitizen>=4.13.9",
    "pre-commit>=4.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.5",
    "ty>=0.0.21",
]
crystal-detector = [
    "cellpose>=4.2.1.1",
    "huggingface-hub>=1.6.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "opencv-python-headless>=4.13.0.92",
    "torch>=2.12.1",
]
crystal-detector-gui = [
    "cellpose[gui]>=4.2.1.1",
    { include-group = "crystal-detector" },
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.8.0"
version_provider = "pep621"
version_files = [
    "pyproject.toml:^version",
]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
changelog_incremental = true
tag_format = "v$version"
major_version_zero = true
bump_message = "bump: release v$current_version -> v$new_version"
